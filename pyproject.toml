[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlocklab"
version = "0.1.0"
description = "Reproducible deadlock detection and prevention research prototype"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.2",
  "networkx>=3.0",
  "matplotlib>=3.7",
  "joblib>=1.3",
]

[tool.setuptools.packages.find]
include = ["deadlocklab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
